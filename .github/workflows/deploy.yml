name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
        env: { GITHUB_PAGES: "1" }
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  # GitHub Pages: https://bmwelu12.github.io/halo/
  pages:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Hugging Face Space (optional): runs only if the repo has an HF_TOKEN secret.
  huggingface-space:
    needs: build
    runs-on: ubuntu-latest
    env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
    steps:
      - uses: actions/checkout@v4
        if: env.HF_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.HF_TOKEN != ''
        with: { node-version: 20, cache: npm }
      - name: Build and upload to the Space
        if: env.HF_TOKEN != ''
        run: |
          npm ci && npm run build
          cp space/README.md dist/README.md
          pip install -q huggingface_hub
          python - <<'PY'
          from huggingface_hub import HfApi
          api = HfApi()
          api.create_repo("bmwelu123/halo", repo_type="space", space_sdk="static", exist_ok=True)
          api.upload_folder(folder_path="dist", repo_id="bmwelu123/halo", repo_type="space")
          PY
